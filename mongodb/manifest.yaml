apiVersion: v1 
kind: Service
metadata:
  name: mongodb-headless
  namespace: roboshop
spec:
  clusterIP: None
  selector:
    purpose: mongodb
    project: roboshop
  ports:
    - protocal: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: v1 
kind: Service
metadata:
  name: mongodb-normal
  namespace: roboshop

spec:
  selector:
    purpose: mongodb
    project: roboshop
  ports:
    - protocal: TCP
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1 
kind: StatefulSet
metadata:
  name: mongodb
  namespace: roboshop

  labels:
    purpose: mongodb
    project: roboshop
spec:
  replicas: 2
  ServiceName: mongodb-headless
  selector:
    matchLabels:
      purpose: mongodb
      project: roboshop
  template:
    metadata:
      labels:
        purpose: mongodb
        project: roboshop 
    spec:
      containers:
        - name: mongodb
          image: abhishekyalla/mongodb:v1
          ports:
            - containerPort: 27017
          volumeMounts:
            name: mongodb
            mountPath: /data/db


  volumeClaimTemplates:
  - metadata: 
      name: mongodb
    spec:
      accessModes: [ "ReadWriteOnce" ]
      storageClassName: "roboshop-ebs"
      resources:
        requests:
          storage: 1Gi

      



